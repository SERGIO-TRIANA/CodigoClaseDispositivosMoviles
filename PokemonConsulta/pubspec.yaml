name: pokedex_app
description: Pokédex con pixel art y estadísticas usando PokéAPI

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0               # Para hacer peticiones HTTP a la PokéAPI
  cached_network_image: ^3.3.1  # Para cachear las imágenes de los pokémon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
